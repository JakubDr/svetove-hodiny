name: svetove-hodiny

services:
  hodiny:
    build:
      context: .
      dockerfile: Dockerfile
    image: svetove-hodiny:1.0.0
    container_name: svetove-hodiny
    restart: unless-stopped
    init: true

    # Host port is configurable: HOST_PORT=9000 docker compose up -d
    ports:
      - "${HOST_PORT:-8080}:3000"

    environment:
      # Timezone of the container = timezone reported as "server time".
      TZ: ${SERVER_TZ:-Europe/Prague}
      PORT: "3000"
      HOST: 0.0.0.0

    # Zero dependencies + read-only filesystem: nothing to write except /tmp.
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"          # the built-in "node" user of the base image
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    labels:
      app.svetove-hodiny.tier: "frontend"
      app.svetove-hodiny.language: "cs"
