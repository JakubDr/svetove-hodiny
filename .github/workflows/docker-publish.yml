name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Spustí se i při vytvoření tagu, např. v1.0.0
  workflow_dispatch: # Umožní spustit akci i ručně tlačítkem na GitHubu

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Automaticky použije tvé_jméno/název_repozitáře

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Povolení pro zápis image do GitHub Container Registry

    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Přihlášení do GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrakce tagů a metadat pro Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Sestavení a nahrání Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
